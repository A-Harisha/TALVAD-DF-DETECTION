seed: 42
experiment_name: gbwso_av_forgery_detection_eval
dataset:
  name: LAV-DF
  root_dir: ./data
  metadata_file: ./data/lavdf_compact_metadata.csv
  cache_dir: ./data/cache
  split:
    train: 0.7
    val: 0.15
    test: 0.15
  balance_classes: true
  k_fold:
    enabled: true
    n_splits: 5
    random_state: 42
preprocessing:
  fps: 1
  frame_size: [224, 224]
  grayscale: false
  audio:
    sample_rate: 16000
    mono: true
    wav_format: true
    preemphasis: 0.97
    wavelet_denoise: false
features:
  cache_enabled: true
  audio:
    n_mfcc: 40
    n_fft: 2048
    hop_length: 512
  cnn:
    enabled: true
    pretrained: true
    image_size: 224
    batch_size: 16
    device: cpu
optimization:
  feature_selection: false
  n_sharks: 30
  max_iter: 80
  min_features: 32
  max_features: 400
  parallel_workers: 4
  fitness_weights:
    accuracy: 0.3
    f1: 0.4
    auc: 0.3
model:
  input_dim: 632
  hidden_dim_1: 128
  hidden_dim_2: 64
  dropout: 0.3
  dense_dim: 32
training:
  batch_size: 16
  epochs: 60
  sequence_length: 12
  lr: 0.0003
  weight_decay: 0.01
  gradient_clip: 1.0
  mixed_precision: true
  early_stopping_patience: 10
  lr_scheduler_patience: 4
  checkpoint_dir: ./checkpoints
  logs_dir: ./logs
evaluation:
  threshold: 0.5
  output_dir: visualizations/eval_local
inference:
  batch_size: 8
