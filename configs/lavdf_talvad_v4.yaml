seed: 42
experiment_name: talvad_v4

dataset:
  name: LAV-DF
  root_dir: ./datasets/LAV-DF-REDUCED-COMPACT/LAV-DF
  metadata_file: ./data/lavdf_compact_metadata.csv
  cache_dir: ./data/cache_v3          # reuse v3 cache — same fps/features
  max_samples: 0
  train_on_all: false
  split:
    train: 0.7
    val: 0.15
    test: 0.15
  balance_classes: false
  k_fold:
    enabled: false
    n_splits: 3
    random_state: 42
  annotation_json: ./datasets/LAV-DF/metadata.min.json

preprocessing:
  fps: 2
  frame_size: [224, 224]
  grayscale: false
  audio:
    sample_rate: 16000
    mono: true
    wav_format: true
    preemphasis: 0.97
    wavelet_denoise: false

features:
  cache_enabled: true
  per_sample_norm: false
  audio:
    n_mfcc: 40
    n_fft: 2048
    hop_length: 512
  cnn:
    enabled: true
    backbone: resnet18
    pretrained: true
    image_size: 224
    batch_size: 16
    device: cuda

optimization:
  feature_selection: false
  n_sharks: 20
  max_iter: 30
  min_features: 32
  max_features: 400
  parallel_workers: 2
  fitness_weights:
    accuracy: 0.3
    f1: 0.4
    auc: 0.3

model:
  input_dim: 632                      # 120 audio + 512 video (resnet18)
  hidden_dim_1: 128
  hidden_dim_2: 64
  dropout: 0.5                        # FIX — increased from v3's 0.4; train_loss was ~0
  dense_dim: 64

  cross_attention: true
  n_heads: 4

  temporal_feature_selection: true
  selector_dim: 64
  tdfs_temperature: 0.5
  tdfs_l1_weight: 1.0e-4

  frame_localization: true

training:
  batch_size: 16
  epochs: 80
  sequence_length: 24
  lr: 0.0001
  lr_scheduler: cosine                # FIX — replaces ReduceLROnPlateau; sustains AUC past epoch 11
  lr_min: 1.0e-6                      # cosine floor
  label_smoothing: 0.1               # FIX — BCEWithLogitsLoss soft labels; penalises overconfidence
  weight_decay: 0.03
  gradient_clip: 1.0
  gradient_accumulation_steps: 2
  mixed_precision: true
  early_stopping_patience: 25
  feature_noise_std: 0.02
  class_weighting: false
  balanced_sampler: true
  tune_threshold: true
  threshold_metric: balanced_accuracy
  checkpoint_metric: auc
  checkpoint_dir: ./checkpoints/talvad_v4
  logs_dir: ./logs

  localization_loss_weight: 0.05
  tdfs_l1_weight: 0.05

evaluation:
  threshold: 0.5
  output_dir: ./visualizations/talvad_v4

inference:
  batch_size: 8
