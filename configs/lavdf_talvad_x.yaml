seed: 42
experiment_name: talvad_x

# TALVAD-X: upgraded encoders (wav2vec2 + EfficientNet-B0 on face crops + enriched
# spectral) feeding the CMIS-2 detector. Additive — does NOT touch v8/v8gen.

dataset:
  name: LAV-DF
  root_dir: ./datasets/LAV-DF
  metadata_file: ./data/lavdf_full_metadata.csv
  annotation_json: ./datasets/LAV-DF/metadata.min.json
  use_official_split: true
  official_split_map:
    train: train
    val: dev
    test: test

preprocessing:
  fps: 12                      # dev resolution (raise to 25 for final localization)
  audio:
    sample_rate: 16000
    mono: true
    preemphasis: 0.97
    wavelet_denoise: false

features:
  pca_dim: 256                 # wav2vec2 768->256, EfficientNet 1280->256
  audio:
    n_mfcc: 40                 # -> 120 with delta+delta2
    n_fft: 2048
    hop_length: 512
  face:
    margin: 0.3
    min_conf: 0.90
  spectral:
    n_radial: 8
    n_angular: 4
    hf_residual: true
    phase: true                # -> 8*4 + 1 + 1 = 34 dims

model:
  dims:
    audio: 376                 # 120 MFCC + 256 wav2vec2-PCA
    appearance: 256            # EfficientNet-PCA
    spectral: 34
  hidden_dim_1: 128
  hidden_dim_2: 64
  dropout: 0.4
  dense_dim: 64
  n_heads: 4
  frame_localization: true
  frame_head_strong: false     # true -> 2-layer MLP frame head (better localization)
  cmis:
    enabled: true
    spectral_branch: true
    consistency_branch: true
    coupling: true
    warm_init: true
    contrastive: true
    motion: false              # true -> feed appearance frame-deltas into the A/V correspondence (motion-aware CMIS)
    corr_dim: 128
    spectral_hidden: 64
    incon_hidden: 16
    band_mlp: 32

training:
  device: cuda
  batch_size: 32
  epochs: 40
  sequence_length: 48          # 48 frames @ 12 fps = 4 s window
  lr: 0.0002
  warmup_epochs: 5
  lr_scheduler: cosine
  lr_min: 1.0e-6
  label_smoothing: 0.05
  weight_decay: 0.05
  gradient_clip: 1.0
  gradient_accumulation_steps: 1
  mixed_precision: true
  early_stopping: true
  early_stopping_patience: 8
  feature_noise_std: 0.03
  temporal_mask_steps: 3
  modality_dropout_p: 0.15
  tune_threshold: true
  threshold_metric: balanced_accuracy
  checkpoint_metric: auc
  checkpoint_dir: ./checkpoints/talvad_x
  logs_dir: ./logs
  # TALVAD-X aux losses
  localization_loss_weight: 0.15
  cmis_incon_loss_weight: 0.10
  contrastive_loss_weight: 0.10
  contrastive_temperature: 0.07
  contrastive_warmup_epochs: 0   # >0 -> ramp InfoNCE weight from 0 over N epochs (shape correspondence before BCE locks onto spectral)
  # ── cross-dataset generalization levers (off by default; enable per-run via --set) ──
  balanced_sampler: true         # WeightedRandomSampler to fix the ~2.7:1 fake skew (enabled for full-split gate)
  pos_weight: null               # alternative to balanced_sampler; BCE positive-class weight
  spectral_aug_p: 0.0            # random per-band scale + masking on the spectral slice (breaks the LAV-DF fingerprint shortcut)
  instance_norm_p: 0.0           # prob. of per-sample standardization as a training augmentation (matches cross-dataset eval regime)
  swa_enabled: false             # SWAD/SWA: average weights over the back-half of training (wider minimum -> better transfer). Suppresses early stopping.
  swa_start_frac: 0.6            # begin weight averaging after this fraction of total epochs
  frame_loss: bce                # bce | focal | dice  (focal/dice help the rare fake-frame localization signal)
  dann_weight: 0.0               # >0 -> domain-adversarial (DANN) head; needs domains (multisource) or pseudo-domains
  n_domains: 4                   # number of domain classes for the DANN head
  multisource: false             # train on the multi-source pack (LODO protocol)
  hold_out_domain: null          # domain name to exclude (Leave-One-Dataset-Out)

evaluation:
  threshold: 0.5
  output_dir: ./visualizations/talvad_x
  instance_norm: false           # cross-dataset eval: per-sample standardization (label-free domain-shift fix)
  tta: false                     # test-time adaptation (Tent): entropy-min on LayerNorm affine over the unlabeled target
  tta_steps: 3                   # Tent optimization passes over the target
  tta_lr: 0.001                  # Tent SGD learning rate (keep small to avoid collapse)

inference:
  batch_size: 64
